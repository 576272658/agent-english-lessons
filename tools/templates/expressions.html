<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表达库</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!-- Generated by tools/lesson.py. Do not edit by hand. -->
<div class="wrap">
  <div class="topbar"><a href="index.html">← 全部课程</a><strong>表达库</strong></div>
  <h1>表达库</h1>
  <p class="tip" id="summary"></p>
  <input class="search" id="q" placeholder="搜索英文、中文或标签…" autocomplete="off">
  <div id="list"></div>
</div>
<script>
const LIB = /*__DATA__*/null;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const say = (t) => { if (!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; speechSynthesis.speak(u); };
const haystack = (e) => [e.phrase, e.meaning_zh, e.note, e.pos, ...(e.tags || []), ...(e.synonyms || []).map((x) => x.phrase + x.zh),
  ...(e.related || []).map((x) => x.phrase + x.zh)].join(" ").toLowerCase();

function draw() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = LIB.filter((e) => !q || haystack(e).includes(q));
  document.getElementById("summary").textContent = `共 ${LIB.length} 个表达${q ? `，匹配 ${rows.length} 个` : ""}`;
  const list = (items) => items.map((x) => `${esc(x.phrase)} <span class="ex-zh" style="display:inline">${esc(x.zh)}</span>`).join("；");
  document.getElementById("list").innerHTML = rows.length ? rows.map((e) => `
    <div class="card expr" style="border-top:1px solid var(--border)">
      <div><span class="phrase">${esc(e.phrase)}</span>${e.pos ? `<span class="tag">${esc(e.pos)}</span>` : ""}
        <button class="btn" onclick="say(${esc(JSON.stringify(e.phrase))})">🔊</button></div>
      <div class="ipa">${esc(e.phonetic)}</div>
      <div><b>${esc(e.meaning_zh)}</b></div>
      <dl>
        ${e.note ? `<dt>用法</dt><dd>${esc(e.note)}</dd>` : ""}
        <dt>例句</dt><dd>${e.examples.map((x) => `<span class="ex-en">${esc(x.en)}</span><span class="ex-zh">${esc(x.zh)}</span>`).join("")}</dd>
        ${e.synonyms?.length ? `<dt>同义表达</dt><dd>${list(e.synonyms)}</dd>` : ""}
        ${e.related?.length ? `<dt>相关表达</dt><dd>${list(e.related)}</dd>` : ""}
        <dt>出现在 ${e.occurrences.length} 处原文</dt><dd>${e.occurrences.map((o) => `<span class="ex-en">${esc(o.en)} <a href="lessons/${o.lesson}/index.html">${esc(o.lesson)}</a></span><span class="ex-zh">${esc(o.zh)}</span>`).join("")}</dd>
      </dl>
    </div>`).join("") : `<div class="empty">${LIB.length ? "没有匹配的表达" : "表达库还是空的，完成第一课后这里会自动汇总。"}</div>`;
}
document.getElementById("q").addEventListener("input", draw);
draw();
</script>
</body>
</html>
