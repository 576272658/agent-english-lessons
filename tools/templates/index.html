<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的英语课程</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!-- Generated by tools/lesson.py. Do not edit by hand. -->
<div class="wrap">
  <div class="topbar"><strong>我的英语课程</strong><a href="expressions.html">表达库 →</a></div>
  <h1>地道口语 · 六步精学</h1>
  <p class="tip" id="summary"></p>
  <input class="search" id="q" placeholder="搜索标题或主题…" autocomplete="off">
  <div class="grid" id="list"></div>
</div>
<script>
const LESSONS = /*__DATA__*/null;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isDone = (id) => { try { return !!localStorage.getItem("done:" + id); } catch { return false; } };

function draw() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = LESSONS.filter((l) => !q || `${l.id} ${l.title} ${l.topic} ${l.channel ?? ""}`.toLowerCase().includes(q));
  const done = LESSONS.filter((l) => isDone(l.id)).length;
  document.getElementById("summary").textContent = `共 ${LESSONS.length} 课，已打卡 ${done} 课`;
  document.getElementById("list").innerHTML = rows.length ? rows.map((l) => `
    <a class="lesson-card" href="lessons/${l.id}/index.html">
      <div class="ep">${esc(l.id)} ${isDone(l.id) ? '<span class="badge">✓ 已打卡</span>' : ""}</div>
      <div class="t">${esc(l.title)}</div>
      <div class="m">${esc(l.topic)}${l.channel ? " · " + esc(l.channel) : ""}</div>
      <div class="m">${l.n_sentences} 句 · ${l.n_expressions} 个表达${l.duration ? " · " + Math.round(l.duration) + " 秒" : ""}</div>
    </a>`).join("") : `<div class="empty">${LESSONS.length ? "没有匹配的课程" : "还没有课程。运行 <code>./lesson new &lt;视频链接&gt;</code> 开始第一课。"}</div>`;
}
document.getElementById("q").addEventListener("input", draw);
draw();
</script>
</body>
</html>
