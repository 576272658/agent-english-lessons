<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141816" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语精学">
<title>学习统计</title>
<link rel="stylesheet" href="style.css">
<script src="offline.js"></script>
<script src="app.js"></script>
<script src="quiz.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="empty">加载中…</div></div>
<script>
const { esc } = App;
const WEEKDAYS = ["一", "", "三", "", "五", "", "日"];

function level(n, max) {
  if (!n) return 0;
  return Math.min(4, Math.ceil((n / Math.max(max, 4)) * 4));
}

function calendar(days) {
  const max = Math.max(...days.map((d) => d.count));
  const first = new Date(days[0].day + "T00:00:00");
  const pad = (first.getDay() + 6) % 7;  // Monday = 0
  const cells = Array(pad).fill(null).concat(days);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  const months = weeks.map((w, i) => {
    const d = w.find(Boolean); if (!d) return "";
    const m = Number(d.day.slice(5, 7)), prev = weeks[i - 1]?.find(Boolean);
    return !prev || Number(prev.day.slice(5, 7)) !== m ? `${m}月` : "";
  });
  return `<div class="cal" role="img" aria-label="最近 ${days.length} 天的学习记录">
    <div class="cal-months"><span></span>${months.map((m) => `<span>${m}</span>`).join("")}</div>
    <div class="cal-body">
      <div class="cal-wd">${WEEKDAYS.map((w) => `<span>${w}</span>`).join("")}</div>
      ${weeks.map((w) => `<div class="cal-col">${w.map((d) => d
        ? `<span class="cell l${level(d.count, max)}" data-tip="${d.day}：${d.count ? d.count + " 次学习" : "没有学习"}"></span>`
        : `<span class="cell pad"></span>`).join("")}</div>`).join("")}
    </div>
    <div class="cal-legend">少 <span class="cell l0"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> 多</div>
    <div class="cal-tip" id="calTip">点按或悬停格子查看当天记录</div>
  </div>`;
}

function levelPicker(settings) {
  return `<section class="card" id="level"><h2>你的水平</h2>
    <p class="tip">课程的难度标签（轻松 / 合适 / 有挑战 / 太难）和课前预习的生词，都按这个水平计算。生词本里测验答对的词也会算作"认识"。拿不准就先选低一档。</p>
    <div class="level-row">${settings.levels.map((lv) => `<button class="chip ${lv.id === settings.level ? "on" : ""}" data-level="${lv.id}">${esc(lv.name)}</button>`).join("")}</div>
  </section>`;
}

function render(s, lib, words, settings) {
  const t = s.totals;
  const tiles = [
    ["学习天数", t.study_days, "天"],
    ["连续学习", t.streak, "天"],
    ["完成课程", t.lessons_done, `/ ${t.lessons_total}`],
    ["掌握表达", t.expressions_mastered, `/ ${t.expressions_total}`],
    ["生词掌握", t.words_mastered, `/ ${t.words_total}`],
    ["测验正确率", t.accuracy ?? "–", t.accuracy == null ? "" : "%"],
  ];
  document.getElementById("app").innerHTML = `
    ${App.nav("stats")}
    <h1>学习统计</h1>
    <div class="tiles">${tiles.map(([label, v, unit]) => `<div class="tile"><div class="tile-l">${label}</div>
      <div class="tile-v">${esc(v)}<span>${esc(unit)}</span></div></div>`).join("")}</div>
    ${levelPicker(settings)}
    <p class="tip">「掌握」= 最近一次测验答对。生词在「表达库 → 生词本」里测验。学习次数 = 测验答题数 + 打卡数。共答题 ${t.quiz_attempts} 次。</p>

    <section class="card"><h2>最近 16 周</h2>${calendar(s.calendar)}</section>

    <section class="card"><h2>最常出错的表达和生词</h2>
      ${s.weak.length ? `<p class="tip">没掌握的排在前面。测验这些表达可以把它们重新答对。</p>
        <div class="btn-row" style="margin-bottom:10px"><button class="btn primary" id="reviewWeak">测验这些（${s.weak.length}）</button></div>
        <div id="quizBox" hidden style="margin-bottom:16px"></div>
        <table class="tbl"><thead><tr><th>表达</th><th>错 / 答</th><th>最近一次</th><th>来源</th></tr></thead><tbody>
        ${s.weak.map((w) => `<tr><td><b>${esc(w.phrase)}</b>${w.kind === "word" ? ' <span class="tag">单词</span>' : ""}<div class="muted">${esc(w.meaning_zh)}</div></td>
          <td class="num">${w.missed} / ${w.attempts}</td>
          <td>${w.last_result === "known" ? "✓ 答对" : "✗ 没答对"}</td>
          <td>${w.lesson ? `<a href="lesson.html?id=${w.lesson}">${esc(w.lesson)}</a>` : "–"}</td></tr>`).join("")}
        </tbody></table>`
      : `<div class="empty">还没有答错的记录。去课程里做做第 6 步的小测验吧。</div>`}
    </section>

    <section class="card"><h2>最近打卡</h2>
      ${s.recent.length ? `<ul class="plain">${s.recent.map((r) => `<li><a href="lesson.html?id=${r.lesson}">${esc(r.lesson)} ${esc(r.title || "")}</a>
        <span class="muted">${esc(r.at.slice(0, 16).replace("T", " "))}</span></li>`).join("")}</ul>`
      : `<div class="empty">还没有打卡记录</div>`}
    </section>`;

  document.querySelectorAll("[data-level]").forEach((b) => b.onclick = async () => {
    try {
      const r = await App.api("api/settings", { method: "PUT", body: { level: b.dataset.level } });
      document.querySelectorAll("[data-level]").forEach((x) => x.classList.toggle("on", x.dataset.level === r.level));
      App.toast(`已设为「${b.textContent}」，课程难度已按新水平重新计算`);
    } catch (e) { App.toast("保存失败，请检查网络"); }
  });
  if (location.hash === "#level") document.getElementById("level").scrollIntoView();
  const tip = document.getElementById("calTip");
  document.querySelectorAll(".cal .cell[data-tip]").forEach((c) => {
    const show = () => { tip.textContent = c.dataset.tip; document.querySelectorAll(".cell.sel").forEach((x) => x.classList.remove("sel")); c.classList.add("sel"); };
    c.addEventListener("mouseenter", show); c.addEventListener("click", show);
  });
  const btn = document.getElementById("reviewWeak");
  if (btn) btn.onclick = () => {
    const byId = Object.fromEntries(lib.map((e) => [e.id, e]));
    const wordById = Object.fromEntries(words.map((w) => [w.word, w]));
    const items = s.weak.map((w) => w.kind === "word"
      ? (wordById[w.id] && App.wordQuizItem(wordById[w.id])) : byId[w.id]).filter(Boolean);
    const box = document.getElementById("quizBox"); box.hidden = false;
    Quiz.mount(box, items, { onFinish: () => App.toast("完成！刷新页面可看到最新统计"), focus: true });
  };
}

Promise.all([App.api("api/stats"), App.api("api/expressions"), App.api("api/words"), App.api("api/settings"), App.progress.load()])
  .then(([s, lib, words, settings]) => render(s, lib, words, settings))
  .catch((e) => App.fail(document.getElementById("app"), e));
</script>
</body>
</html>
