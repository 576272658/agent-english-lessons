<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141816" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语精学">
<title>Lesson</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
<script src="quiz.js"></script>
<script src="word.js"></script>
</head>
<body>
<!-- Lesson page: lesson.html?id=EP001. Data comes from api/lessons/<id>. -->
<div class="wrap" id="app"><div class="empty">加载中…</div></div>
<script>
const { esc, progress } = App;
let L = null;
let rate = Number(App.pref.get("rate", 1));

// Wrap the first non-overlapping occurrence of each needle. render(match, highlight) -> html
function markUp(text, highlights, field, render) {
  const spans = [];
  for (const h of highlights || []) {
    const needle = h[field];
    let from = 0, i;
    while ((i = text.indexOf(needle, from)) !== -1) {
      if (!spans.some((s) => i < s.end && i + needle.length > s.start)) { spans.push({ start: i, end: i + needle.length, h }); break; }
      from = i + 1;
    }
  }
  spans.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const s of spans) {
    out += esc(text.slice(pos, s.start)) + render(text.slice(s.start, s.end), s.h);
    pos = s.end;
  }
  return out + esc(text.slice(pos));
}
const zhWithEn = (s) => markUp(s.zh, s.highlights, "zh", (m, h) => `<mark class="hl">${esc(m)}</mark><span class="gloss">${esc(h.en)}</span>`);
const enWithZh = (s) => markUp(s.en, s.highlights, "en", (m, h) => `<mark class="hl" data-hl-expr="${esc(h.expr)}">${esc(m)}</mark><span class="gloss">${esc(h.zh)}</span>`);
const enCloze = (s) => markUp(s.en, s.highlights, "en", (m) => `<span class="blank" title="点击显示">${esc(m)}</span>`);

function speedControl() {
  return `<span class="speed" data-speed>${[0.75, 1, 1.25].map((r) => `<button data-rate="${r}" class="${r === rate ? "on" : ""}">${r}x</button>`).join("")}</span>`;
}

function mediaBlock(key) {
  const tag = L.has_video
    ? `<video data-media="${key}" src="${esc(L.media)}" controls playsinline preload="metadata"></video>`
    : `<audio data-media="${key}" src="${esc(L.media)}" controls preload="metadata"></audio>`;
  return `<div class="player ${L.has_video ? "" : "audio-only"}">${tag}<div class="caption" data-caption="${key}"></div></div>
    <div class="btn-row"><button class="btn on" data-toggle-caption="${key}">字幕：英文</button>${speedControl()}</div>`;
}

function exprCard(e) {
  const list = (items) => items.map((x) => `${esc(x.phrase)} <span class="ex-zh" style="display:inline">${esc(x.zh)}</span>`).join("；");
  const inLesson = L.sentences.filter((s) => (s.highlights || []).some((h) => h.expr === e.id));
  return `<div class="expr" data-expr="${esc(e.id)}">
    <div><span class="phrase">${esc(e.phrase)}</span>${e.pos ? `<span class="tag">${esc(e.pos)}</span>` : ""}
      <button class="btn" data-say="${esc(e.id)}" title="播放发音">🔊</button></div>
    <div class="ipa">${esc(e.phonetic)}</div>
    <div><b>${esc(e.meaning_zh)}</b></div>
    <dl>
      ${e.note ? `<dt>用法</dt><dd>${esc(e.note)}</dd>` : ""}
      <dt>例句</dt><dd>${e.examples.map((x) => `<span class="ex-en" data-zh="${esc(x.zh)}">${esc(x.en)}</span><span class="ex-zh">${esc(x.zh)}</span>`).join("")}</dd>
      ${e.synonyms?.length ? `<dt>同义表达</dt><dd>${list(e.synonyms)}</dd>` : ""}
      ${e.related?.length ? `<dt>相关表达</dt><dd>${list(e.related)}</dd>` : ""}
      ${inLesson.length ? `<dt>本课原句</dt><dd>${inLesson.map((s) => `<span class="ex-en" data-sid="${s.id}">${enWithZh(s)}</span><span class="ex-zh">${esc(s.zh)}</span>`).join("")}</dd>` : ""}
    </dl></div>`;
}

function render() {
  document.title = `${L.id} ${L.title}`;
  const src = L.source || {};
  const done = progress.isDone(L.id);
  const app = document.getElementById("app");
  app.innerHTML = `
  ${App.nav("courses")}
  <div class="meta"><span>${esc(L.id)}</span><span>主题：${esc(L.topic)}</span>${src.channel ? `<span>博主：${esc(src.channel)}</span>` : ""}
    ${src.url ? `<span><a href="${esc(src.url)}" target="_blank" rel="noopener">原视频</a></span>` : ""}${src.created ? `<span>${esc(src.created)}</span>` : ""}</div>
  <h1>${esc(L.title)}</h1>
  <div class="btn-row no-print">
    <button class="btn ${done ? "on" : ""}" id="doneBtn">${done ? "✓ 已打卡" : "打卡"}</button>
    <button class="btn" onclick="window.print()">打印 / 存为 PDF</button>
  </div>
  ${L.notes ? `<p class="tip">${esc(L.notes)}</p>` : ""}

  <section class="card"><h2><span class="step-no">1</span>对照中文，尝试开口说英文</h2>
    <p class="tip">看着中文，用英文把整段说出来。高亮处是本课要学的地道表达，可以先隐藏提示挑战一下。</p>
    <div class="btn-row no-print" style="margin-bottom:10px"><button class="btn on" id="glossBtn">英文提示：显示</button></div>
    <div class="prose" id="step1">${L.sentences.map(zhWithEn).join(" ")}</div>
  </section>

  <section class="card"><h2><span class="step-no">2</span>对照英文，排查卡壳的地方</h2>
    <p class="tip">对照母语者原文，找出刚才说不出来或说得不地道的地方，然后看视频听原声。</p>
    <p class="tip no-print">💡 点击任意英文单词查看释义、听发音，并可加入生词本。</p>
    <div class="prose" id="step2">${L.sentences.map((s) => `<span data-sid="${s.id}">${enWithZh(s)}</span>`).join(" ")}</div>
    ${mediaBlock("main")}
  </section>

  <section class="card"><h2><span class="step-no">3</span>精读：积累地道表达</h2>
    <p class="tip">本课 ${L.expressions.length} 个表达，点击切换查看解析。</p>
    <div class="chips no-print">${L.expressions.map((e, i) => `<button class="chip ${i === 0 ? "on" : ""}" data-chip="${esc(e.id)}">${esc(e.phrase)}</button>`).join("")}</div>
    <div id="exprs">${L.expressions.map(exprCard).join("")}</div>
  </section>

  <section class="card"><h2><span class="step-no">4</span>单句跟读，模仿语音语调</h2>
    <p class="tip">逐句听原声 → 跟读 → 录音对比。注意连读、弱读和断句。🔁 可单句循环。</p>
    <div class="btn-row no-print" style="margin-bottom:6px">${speedControl()}</div>
    ${L.sentences.map((s) => `<div class="sent" data-sent="${s.id}">
      <div class="en">${enWithZh(s)}</div><div class="ipa">${esc(s.ipa)}</div><div class="zh">${esc(s.zh)}</div>
      <div class="btn-row no-print">
        <button class="btn" data-orig="${s.id}">▶ 原声</button>
        ${s.tts ? `<button class="btn" data-tts="${s.id}">▶ 标准美音</button>` : ""}
        <button class="btn" data-loop="${s.id}">🔁</button>
        <button class="btn" data-rec="${s.id}">🎤 录音</button>
        <button class="btn" data-mine="${s.id}" disabled>▶ 我的录音</button>
      </div></div>`).join("")}
  </section>

  <section class="card"><h2><span class="step-no">5</span>口头填空，巩固地道表达</h2>
    <p class="tip">口头说出空格里的表达，点击空格核对。最后关掉字幕重看一遍视频，检查能否完全听懂。</p>
    <div class="btn-row no-print" style="margin-bottom:10px"><button class="btn" id="revealAll">全部显示</button><button class="btn" id="hideAll">全部隐藏</button></div>
    <div class="prose" id="cloze">${L.sentences.map(enCloze).join(" ")}</div>
    <details style="margin-top:12px"><summary class="tip" style="cursor:pointer">中文参考</summary><div class="prose">${L.sentences.map(zhWithEn).join(" ")}</div></details>
  </section>

  <section class="card no-print"><h2><span class="step-no">6</span>小测验，完成打卡</h2>
    <p class="tip">看中文、听发音，拼出本课的表达。每题 3 次机会。做完自动打卡。</p>
    <div id="quiz"></div>
    <div class="done-banner"><button class="btn ${done ? "on" : ""}" id="doneBtn2">${done ? "✓ 已打卡" : "打卡"}</button></div>
  </section>

  <div class="pager no-print">
    ${L.prev ? `<a class="btn" href="lesson.html?id=${L.prev}">← ${L.prev}</a>` : "<span></span>"}
    ${L.next ? `<a class="btn" href="lesson.html?id=${L.next}">${L.next} →</a>` : "<span></span>"}
  </div>`;
  wire();
}

function wire() {
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  // done
  const setDone = (done) => {
    progress.setDone(L.id, done);
    [$("#doneBtn"), $("#doneBtn2")].forEach((b) => { b.classList.toggle("on", done); b.textContent = done ? "✓ 已打卡" : "打卡"; });
  };
  $("#doneBtn").onclick = $("#doneBtn2").onclick = () => setDone(!progress.isDone(L.id));

  // step 6 quiz
  Quiz.mount($("#quiz"), L.expressions, { onFinish: () => setDone(true) });

  // step 1 gloss toggle
  $("#glossBtn").onclick = (ev) => {
    const hidden = $("#step1").classList.toggle("hide-gloss");
    ev.target.classList.toggle("on", !hidden); ev.target.textContent = `英文提示：${hidden ? "隐藏" : "显示"}`;
  };

  // captions synced to sentences (works offline without a <track> file)
  const capMode = {};
  $$("[data-media]").forEach((m) => {
    const key = m.dataset.media, cap = $(`[data-caption="${key}"]`);
    capMode[key] = "en";
    m.addEventListener("timeupdate", () => {
      const s = L.sentences.find((x) => m.currentTime >= x.start && m.currentTime < x.end);
      const mode = capMode[key];
      cap.classList.toggle("off", mode === "off");
      cap.innerHTML = !s ? "" : esc(s.en) + (mode === "both" ? `<span class="zh">${esc(s.zh)}</span>` : "");
    });
  });
  $$("[data-toggle-caption]").forEach((b) => b.onclick = () => {
    const key = b.dataset.toggleCaption, order = ["en", "both", "off"], label = { en: "英文", both: "中英", off: "关闭" };
    capMode[key] = order[(order.indexOf(capMode[key]) + 1) % order.length];
    b.textContent = `字幕：${label[capMode[key]]}`; b.classList.toggle("on", capMode[key] !== "off");
    $(`[data-media="${key}"]`).dispatchEvent(new Event("timeupdate"));
  });

  // speed
  const applyRate = () => {
    $$("[data-media]").forEach((m) => m.playbackRate = rate);
    seg.playbackRate = rate; tts.playbackRate = rate;
    $$("[data-speed] button").forEach((b) => b.classList.toggle("on", Number(b.dataset.rate) === rate));
  };
  $$("[data-speed] button").forEach((b) => b.onclick = () => { rate = Number(b.dataset.rate); App.pref.set("rate", rate); applyRate(); });

  // step 3 chips
  const showExpr = (id) => {
    $$("[data-expr]").forEach((el) => el.hidden = el.dataset.expr !== id);
    $$("[data-chip]").forEach((c) => c.classList.toggle("on", c.dataset.chip === id));
  };
  $$("[data-chip]").forEach((c) => c.onclick = () => showExpr(c.dataset.chip));
  if (!matchMedia("print").matches && L.expressions[0]) showExpr(L.expressions[0].id);
  addEventListener("beforeprint", () => $$("[data-expr]").forEach((el) => el.hidden = false));
  addEventListener("afterprint", () => showExpr($(".chip.on")?.dataset.chip || L.expressions[0].id));
  $$("[data-say]").forEach((b) => b.onclick = () => {
    const e = L.expressions.find((x) => x.id === b.dataset.say);
    App.play(e.tts, e.answer, rate);
  });

  // step 4 sentence playback
  const seg = new Audio(L.audio), tts = new Audio();
  let current = null, looping = null, raf = 0;
  const stopAll = () => { seg.pause(); tts.pause(); cancelAnimationFrame(raf); $$(".sent.playing").forEach((el) => el.classList.remove("playing")); };
  const highlight = (id) => $(`[data-sent="${id}"]`)?.classList.add("playing");
  const playOrig = (s) => {
    stopAll(); current = s; highlight(s.id);
    seg.currentTime = Math.max(0, s.start - 0.05); seg.playbackRate = rate; seg.play();
    const tick = () => {
      if (seg.currentTime >= s.end) {
        if (looping === s.id) { seg.currentTime = Math.max(0, s.start - 0.05); }
        else { stopAll(); return; }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };
  $$("[data-orig]").forEach((b) => b.onclick = () => playOrig(L.sentences.find((s) => s.id == b.dataset.orig)));
  $$("[data-tts]").forEach((b) => b.onclick = () => {
    const s = L.sentences.find((x) => x.id == b.dataset.tts);
    stopAll(); highlight(s.id); tts.src = s.tts; tts.playbackRate = rate; tts.play();
    tts.onended = () => looping === s.id ? tts.play() : stopAll();
  });
  $$("[data-loop]").forEach((b) => b.onclick = () => {
    const id = Number(b.dataset.loop);
    looping = looping === id ? null : id;
    $$("[data-loop]").forEach((x) => x.classList.toggle("on", Number(x.dataset.loop) === looping));
    if (looping) playOrig(L.sentences.find((s) => s.id === id)); else stopAll();
  });

  // recording (needs mic permission; hidden if unsupported)
  const recs = {};
  let recorder = null;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) $$("[data-rec],[data-mine]").forEach((b) => b.hidden = true);
  $$("[data-rec]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.rec;
    if (recorder) { recorder.stop(); return; }
    try {
      stopAll();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        if (recs[id]) URL.revokeObjectURL(recs[id]);
        recs[id] = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType }));
        recorder = null;
        b.innerHTML = "🎤 重录"; b.classList.remove("on");
        const mine = $(`[data-mine="${id}"]`); mine.disabled = false;
      };
      recorder.start();
      b.innerHTML = '<span class="rec-dot"></span> 停止'; b.classList.add("on");
    } catch (e) { alert("无法使用麦克风：" + e.message); recorder = null; }
  });
  $$("[data-mine]").forEach((b) => b.onclick = () => { stopAll(); tts.src = recs[b.dataset.mine]; tts.playbackRate = 1; tts.onended = null; tts.play(); });

  // step 5 cloze
  $$("#cloze .blank").forEach((el) => el.onclick = () => el.classList.toggle("shown"));
  $("#revealAll").onclick = () => $$("#cloze .blank").forEach((el) => el.classList.add("shown"));
  $("#hideAll").onclick = () => $$("#cloze .blank").forEach((el) => el.classList.remove("shown"));

  // click-to-look-up on English text (not steps 1 and 5: that would give the answers away)
  Words.init({
    lesson: L.id,
    context(el) {
      const host = el.closest("[data-sid], [data-sent]");
      if (host) {
        const s = L.sentences.find((x) => x.id == (host.dataset.sid || host.dataset.sent));
        return s && { context_en: s.en, context_zh: s.zh };
      }
      const ex = el.closest(".ex-en");
      return ex ? { context_en: ex.textContent.trim(), context_zh: ex.dataset.zh || "" } : null;
    },
    expression(el) {
      const id = el.closest("mark.hl")?.dataset.hlExpr;
      const e = id && L.expressions.find((x) => x.id === id);
      return e ? { id, phrase: e.phrase } : null;
    },
    onExpression(id) { showExpr(id); $("#exprs").closest("section").scrollIntoView({ behavior: "smooth" }); },
  });
  Words.wordify($("#step2"));
  $$(".sent .en, #exprs .ex-en").forEach((el) => Words.wordify(el));

  applyRate();
}

const id = new URLSearchParams(location.search).get("id");
Promise.all([App.api(`api/lessons/${encodeURIComponent(id || "")}`), progress.load()])
  .then(([lesson]) => { L = lesson; render(); })
  .catch((e) => App.fail(document.getElementById("app"), e));
</script>
</body>
</html>
